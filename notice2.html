<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공지 — 새차원회</title>

<style>
body{
    margin:0;
    background:white;
    font-family:Arial, sans-serif;
    color:#111;
    text-align:center;
}

/* 햄버거 */
.menu-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:28px;
    cursor:pointer;
}
.menu-btn div{
    height:3px;
    background:#111;
    margin:6px 0;
}

/* 사이드바 */
.sidebar{
    position:fixed;
    top:0;
    left:-220px;
    width:220px;
    height:100%;
    background:#f4f4f4;
    padding-top:100px;
    transition:0.3s;
}
.sidebar.open{ left:0; }

.sidebar a{
    display:block;
    padding:15px 40px 15px 15px;
    text-decoration:none;
    color:#333;
    font-size:17px;
    text-align:right;
}

/* 상단 */
.top{ padding-top:60px; }

.logo{ width:110px; }

h1{
    margin:0;
    font-size:28px;
    letter-spacing:4px;
}
h1 a{
    text-decoration:none;
    color:#111;
}

/* 본문 영역 */
.notice-detail{
    max-width:600px;
    margin:120px auto;
    padding:0 20px;
    text-align:left;
}

.notice-detail h2{
    font-size:26px;
    margin-bottom:8px;
}

.notice-date{
    font-size:13px;
    color:#888;
    margin-bottom:25px;
}

.notice-content{
    font-size:18px;
    line-height:1.7;
    color:#444;
}

/* 뒤로가기 */
.back-btn{
    margin-top:40px;
    font-size:14px;
}
.back-btn a{
    text-decoration:none;
    color:#666;
}

/* 이메일 */
.contact-email{
    position:fixed;
    bottom:12px;
    right:18px;
    font-size:12px;
    color:#999;
}
.contact-email a{
    color:#999;
    text-decoration:none;
}
</style>
</head>
<body>

<div class="menu-btn" onclick="toggleMenu()">
<div></div><div></div><div></div>
</div>

<div class="sidebar" id="sidebar">
<a href="index.html">소개</a>
<a href="notice.html" class="active">공지</a>
<a href="location.html">오시는길</a>
</div>

<div class="top">
<img class="logo" src="img/logo.png">
<h1><a href="index.html">새차원회</a></h1>
</div>

<section class="notice-detail">

<h2>임시 공지 제목입니다</h2>
<div class="notice-date">1987.12.08</div>

<div class="notice-content">
이곳은 공지의 본문이 들어가는 영역입니다.<br><br>
여러 줄의 내용을 자유롭게 작성할 수 있습니다.<br>
실제 안내문, 발표문, 공지사항 등을 입력하세요.
</div>

<div class="back-btn">
<a href="notice.html">← 목록으로 돌아가기</a>
</div>

</section>

<div class="contact-email">
문의 이메일
<a href="mailto:lee.new.dimension@gmail.com">
lee.new.dimension@gmail.com
</a>
</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("open");
}
</script>

</body>
</html>
