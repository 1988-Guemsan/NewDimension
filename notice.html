<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>공지 — 새차원회</title>

<style>
body{
    margin:0;
    background:white;
    font-family:Arial, sans-serif;
    color:#111;
}

/* 상단 로고영역 */
.top{
    padding-top:60px;
    text-align:center;
}
.logo{
    width:110px;
    margin-bottom:2px;
}
h1{
    margin:0;
    font-size:28px;
    letter-spacing:4px;
}

/* 공지 영역 */
.notice-wrap{
    max-width:900px;
    margin:80px auto;
    padding:0 20px;
}

/* 공지 박스 */
.notice{
    border:1px solid #ddd;
    padding:28px;
    margin-bottom:25px;
    transition:0.2s;
}

.notice:hover{
    border-color:#bbb;
}

/* 제목 */
.notice h2{
    margin:0;
    font-size:24px;
    font-weight:700;
    color:#222;
}
</style>
</head>
<body>

<div class="top">
<img class="logo" src="img/logo.png">
<h1>새차원회</h1>
</div>

<section class="notice-wrap">

<div class="notice">
<h2>임시 공지 제목입니다</h2>
</div>

<div class="notice">
<h2>두번째 공지 제목 자리</h2>
</div>

<div class="notice">
<h2>세번째 공지 제목 자리</h2>
</div>

<div class="notice">
<h2>네번째 공지 제목 자리</h2>
</div>

</section>

</body>
</html>
