<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>새차원회</title>

<style>
body{
    margin:0;
    background:white;
    font-family:Arial, sans-serif;
    color:#111;
    text-align:center;
}

/* 햄버거 버튼 */
.menu-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:28px;
    cursor:pointer;
    z-index:1000;
}
.menu-btn div{
    height:3px;
    background:#111;
    margin:6px 0;
}

/* 사이드 메뉴 */
.sidebar{
    position:fixed;
    top:0;
    left:-220px;
    width:220px;
    height:100%;
    background:#f4f4f4;
    padding-top:100px;
    transition:0.3s;
    box-shadow:2px 0 8px rgba(0,0,0,0.1);
}
.sidebar.open{
    left:0;
}

/* 메뉴 글자 */
.sidebar a{
    display:block;
    padding:15px 40px 15px 15px;
    text-decoration:none;
    color:#333;
    font-size:17px;
    text-align:right;
}
.sidebar a:hover{
    background:#e6e6e6;
}
.sidebar a.active{
    background:#dcdcdc;
}

/* 검색 버튼 */
.search-btn{
    position:fixed;
    top:20px;
    right:20px;
    width:24px;
    height:24px;
    cursor:pointer;
}
.search-btn svg{
    width:100%;
    height:100%;
    stroke:#888;
    fill:none;
    stroke-width:2;
}

/* 검색창 (밑줄 스타일) */
.search-wrap{
    position:fixed;
    top:20px;
    right:60px;
    display:none;
}
.search-wrap input{
    border:none;
    border-bottom:1px solid #aaa;
    outline:none;
    font-size:15px;
    padding:4px 2px;
    background:transparent;
    width:160px;
}

/* 상단 영역 */
.top{
    padding-top:60px;
}

/* 로고 */
.logo{
    width:110px;
    margin-bottom:2px;
}

/* 제목 */
h1{
    margin:0;
    font-size:28px;
    letter-spacing:4px;
}

.contact-email{
    position:fixed;
    bottom:12px;
    right:18px;
    font-size:12px;
    color:#999;
}

.contact-email a{
    color:#999;
    text-decoration:none;
}

.contact-email a:hover{
    text-decoration:underline;
}

.main-intro{
    max-width:720px;
    margin:120px auto 0 auto;
    padding:0 20px;
}

.main-intro h2{
    font-size:38px;
    font-weight:600;
    color:#222; /* 거의 검정 */
    margin-bottom:25px;
}

.main-intro p{
    font-size:18px;
    line-height:1.7;
    color:#666; /* 덜 어두운 회색 */
}

</style>
</head>
<body>

<!-- 햄버거 -->
<div class="menu-btn" onclick="toggleMenu()">
<div></div>
<div></div>
<div></div>
</div>

<!-- 사이드 메뉴 -->
<div class="sidebar" id="sidebar">
<a href="#" class="active">소개</a>
<a href="notice.html">공지</a>
<a href="location.html">오시는길</a>
</div>

<!-- 검색창 -->
<div class="search-wrap" id="searchWrap">
<input type="text" placeholder="검색어 입력">
</div>

<!-- 검색 버튼 -->
<div class="search-btn" onclick="toggleSearch()">
<svg viewBox="0 0 24 24">
<circle cx="11" cy="11" r="7"/>
<line x1="16" y1="16" x2="21" y2="21"/>
</svg>
</div>

<!-- 상단 -->
<div class="top">
<img class="logo" src="img/logo.png">
<h1>새차원회</h1>
</div>

<section class="main-intro">
    <h2>새 미래와 새 세상의<br>당당한 주인이 되어 나아갑시다.</h2>
    <p>
새천년의 문은 스스로 열리지 않습니다. 우리가 피땀흘려 직접 열어내야 합니다. 불타고 짓밟힌 세상의 넝마주이를 넘어서, 새 세상으로의 문을 열어야 합니다. 우리를 위해 희생한 이들을 통해 눈을 뜨고 나아가야 합니다. 우리는 사슬에서 해방되고 우연의 지배에서 벗어나, 진리와 덕과 행복의 길을 찾아냅니다.
    </p>
</section>

<script>
function toggleMenu(){
    document.getElementById("sidebar").classList.toggle("open");
}

function toggleSearch(){
    const box=document.getElementById("searchWrap");
    box.style.display=
        box.style.display==="block"?"none":"block";
}

const links=document.querySelectorAll(".sidebar a");

links.forEach(link=>{
    link.addEventListener("click",function(e){
        if(this.getAttribute("href")==="#"){
    e.preventDefault();
}
        links.forEach(l=>l.classList.remove("active"));
        this.classList.add("active");
    });
});
</script>

<div class="contact-email">
문의 이메일 
<a href="mailto:lee.new.dimension@gmail.com">
lee.new.dimension@gmail.com
</a>
</div>

</body>
</html>
