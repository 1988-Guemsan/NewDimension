<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>오시는길 — 새차원회</title>

<style>
body{
    margin:0;
    background:white;
    font-family:Arial, sans-serif;
    text-align:center;
}

/* 햄버거 */
.menu-btn{
    position:fixed;
    top:20px;
    left:20px;
    width:28px;
    cursor:pointer;
}
.menu-btn div{
    height:3px;
    background:#111;
    margin:6px 0;
}

/* 사이드바 */
.sidebar{
    position:fixed;
    top:0;
    left:-220px;
    width:220px;
    height:100%;
    background:#f4f4f4;
    padding-top:100px;
    transition:0.3s;
}
.sidebar.open{ left:0; }

.sidebar a{
    display:block;
    padding:15px 40px 15px 15px;
    text-decoration:none;
    color:#333;
    font-size:17px;
    text-align:right;
}
.sidebar a:hover{ background:#e6e6e6; }
.sidebar a.active{ background:#dcdcdc; }

/* 상단 */
.top{ padding-top:60px; }

.logo{ width:110px; }

h1{
    margin:0;
    font-size:28px;
    letter-spacing:4px;
}
h1 a{
    text-decoration:none;
    color:#111;
}

/* 본문 */
.content{
    margin-top:140px;
    font-size:20px;
    color:#444;
}

/* 이메일 */
.contact-email{
    position:fixed;
    bottom:12px;
    right:18px;
    font-size:12px;
    color:#999;
}
.contact-email a{
    color:#999;
    text-decoration:none;
}

.sub-text{
    margin-top:20px;
    font-size:15px;
    color:#777;
    line-height:1.6;
}

</style>
</head>
<body>

<div class="menu-btn" onclick="toggleMenu()">
<div></div><div></div><div></div>
</div>

<div class="sidebar" id="sidebar">
<a href="index.html">소개</a>
<a href="notice.html">공지</a>
<a href="location.html" class="active">오시는길</a>
</div>

<div class="top">
<img class="logo" src="img/logo.png">
<h1><a href="index.html">새차원회</a></h1>
</div>

<div class="content">
충청북도 광흥군 금산면 중앙 1리
<div class="sub-text">
중앙 1리의 상가 혹은 마을회관 방문시 안내 도와드립니다.<br>
추가 안내는 문의 이메일을 이용해주세요.<br>
주차 공간이 협소한 점 양해바랍니다.
</div>
</div>

<div class="contact-email">
문의 이메일
<a href="mailto:lee.new.dimension@gmail.com">lee.new.dimension@gmail.com</a>
</div>

<script>
function toggleMenu(){
document.getElementById("sidebar").classList.toggle("open");
}

const links=document.querySelectorAll(".sidebar a");
links.forEach(link=>{
link.addEventListener("click",function(e){
if(this.getAttribute("href")==="#"){ e.preventDefault(); }
links.forEach(l=>l.classList.remove("active"));
this.classList.add("active");
});
});
</script>

</body>
</html>
